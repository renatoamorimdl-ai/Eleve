apiVersion: apps/v1
kind: Deployment
metadata:
  name: renato-eleve
  namespace: renato-eleve
  labels:
    app: renato-eleve
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: renato-eleve
  template:
    metadata:
      labels:
        app: renato-eleve
        version: v1.0.13
    spec:
      containers:
        - name: renato-eleve-container
          image: ideiasemdesenvolvimento/renato-eleve:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          envFrom:
            - secretRef:
                name: renato-eleve-app-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
